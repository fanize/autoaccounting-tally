name: Auto Build AA
on:
  schedule: [{cron: "0 2 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {issues: write, contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/AutoAccountingOrg/AutoAccounting.git upstream
      - id: up
        run: cd upstream && echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - id: patch
        run: cd upstream && (git apply ../patches/aa-tally.patch && echo "ok=true" >> $GITHUB_OUTPUT) || (echo "ok=false" >> $GITHUB_OUTPUT && echo "Patch failed")
      - if: steps.patch.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with: {java-version: "21", distribution: "microsoft"}
      - if: steps.patch.outputs.ok == 'true'
        run: cd upstream && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - if: steps.patch.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "aa-${{ steps.up.outputs.sha }}"
          files: upstream/app/build/outputs/apk/debug/*.apk
      - if: steps.patch.outputs.ok == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:"Patch failed on ${{ steps.up.outputs.sha }}",body:"Update patches/aa-tally.patch"})
